name: "Studio Frontend Build"

on:
  push:
    branches:
      - "main"
      - "[0-9]+.[0-9]+"
      - "[0-9]+.x"
    paths:
      - "assets/studio/**"
      - "build-dist/**"
  pull_request:
    paths:
      - "assets/studio/**"
      - "build-dist/**"
  workflow_dispatch:

concurrency:
  group: studio-frontend-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  studio-frontend-build:
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-studio-frontend-build-packaged.yaml@9d871b230bc5450ece43e527160000a3dc16f3e5 # main
