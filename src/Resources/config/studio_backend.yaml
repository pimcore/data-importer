services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Pimcore\Bundle\DataImporterBundle\Controller\Studio\:
        resource: '../../Controller/Studio'
        public: true
        tags: [ 'controller.service_arguments' ]

    Pimcore\Bundle\DataImporterBundle\Service\Studio\ConfigurationServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\ConfigurationService

    Pimcore\Bundle\DataImporterBundle\Service\Studio\PreviewDataServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\PreviewDataService

    Pimcore\Bundle\DataImporterBundle\Service\Studio\TransformationServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\TransformationService

    Pimcore\Bundle\DataImporterBundle\Service\Studio\ImportServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\ImportService

    Pimcore\Bundle\DataImporterBundle\Service\Studio\DataTypeServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\DataTypeService

    Pimcore\Bundle\DataImporterBundle\Hydrator\ConfigurationDetailHydratorInterface:
        class: Pimcore\Bundle\DataImporterBundle\Hydrator\ConfigurationDetailHydrator

    Pimcore\Bundle\DataImporterBundle\Hydrator\PreviewHydratorInterface:
        class: Pimcore\Bundle\DataImporterBundle\Hydrator\PreviewHydrator

    Pimcore\Bundle\DataImporterBundle\Hydrator\TransformationHydratorInterface:
        class: Pimcore\Bundle\DataImporterBundle\Hydrator\TransformationHydrator

    Pimcore\Bundle\DataImporterBundle\Hydrator\ImportHydratorInterface:
        class: Pimcore\Bundle\DataImporterBundle\Hydrator\ImportHydrator

    Pimcore\Bundle\DataImporterBundle\Hydrator\DataTypeHydratorInterface:
        class: Pimcore\Bundle\DataImporterBundle\Hydrator\DataTypeHydrator

    Pimcore\Bundle\DataImporterBundle\Service\Studio\ConnectionServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\ConnectionService
        arguments:
            $doctrineConnections: '%doctrine.connections%'

    Pimcore\Bundle\DataImporterBundle\Hydrator\ConnectionHydratorInterface:
        class: Pimcore\Bundle\DataImporterBundle\Hydrator\ConnectionHydrator

    Pimcore\Bundle\DataImporterBundle\Service\Studio\MappingSuggestionServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\MappingSuggestionService

    Pimcore\Bundle\DataImporterBundle\Hydrator\MappingSuggestionHydratorInterface:
        class: Pimcore\Bundle\DataImporterBundle\Hydrator\MappingSuggestionHydrator

    Pimcore\Bundle\DataImporterBundle\Mapping\Suggestion\ColumnMatcher: ~

    Pimcore\Bundle\DataImporterBundle\Mapping\Suggestion\SampleValuePicker: ~

    Pimcore\Bundle\DataImporterBundle\Service\Studio\SampleValueReader: ~

    # the agent bundle is optional: without it, suggestions come from the name comparison alone
    Pimcore\Bundle\DataImporterBundle\Mapping\Suggestion\AiSuggestionStage:
        arguments:
            $tasks: '@?Pimcore\Contracts\PimcoreAgent\AgentTaskServiceInterface'

    Pimcore\Bundle\DataImporterBundle\Service\Studio\ConfigurationLookupInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\ConfigurationLookup

    Pimcore\Bundle\DataImporterBundle\Service\Studio\PreviewRowsServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\PreviewRowsService

    Pimcore\Bundle\DataImporterBundle\Service\Studio\AdHocImportServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\AdHocImportService

    Pimcore\Bundle\DataImporterBundle\Service\Studio\AdHocImportMappingServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\AdHocImportMappingService

    Pimcore\Bundle\DataImporterBundle\Service\Studio\AdHocImportConfigurationServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\AdHocImportConfigurationService

    Pimcore\Bundle\DataImporterBundle\Service\Studio\AdHocImportTransformationServiceInterface:
        class: Pimcore\Bundle\DataImporterBundle\Service\Studio\AdHocImportTransformationService

    Pimcore\Bundle\DataImporterBundle\AdHocImport\CsvDelimiterDetector: ~
    Pimcore\Bundle\DataImporterBundle\AdHocImport\FileInspector: ~
    Pimcore\Bundle\DataImporterBundle\AdHocImport\FileStore: ~
    Pimcore\Bundle\DataImporterBundle\AdHocImport\TransformationChain: ~
