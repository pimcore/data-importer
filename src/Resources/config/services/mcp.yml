# Loaded only when an MCP host is installed AND Change Control is - see
# PimcoreDataImporterExtension. Without the review lane there is nothing to propose onto.
services:
    _defaults:
        autowire: true
        autoconfigure: false
        public: false

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ListImportConfigsTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read', description: 'List the import configurations' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetImportConfigTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ListConfigPrincipalsTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read', description: 'List role and user names for configuration permissions' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ImportConfigVocabulary:
        arguments:
            # keys are ProposedImportConfiguration::FAMILY_*, which the refusals print
            $families:
                'loader': !tagged_iterator { tag: 'pimcore.datahub.data_importer.loader', index_by: 'type' }
                'interpreter': !tagged_iterator { tag: 'pimcore.datahub.data_importer.interpreter', index_by: 'type' }
                'loading strategy': !tagged_iterator { tag: 'pimcore.datahub.data_importer.resolver.load', index_by: 'type' }
                'location strategy': !tagged_iterator { tag: 'pimcore.datahub.data_importer.resolver.location', index_by: 'type' }
                'publishing strategy': !tagged_iterator { tag: 'pimcore.datahub.data_importer.resolver.publish', index_by: 'type' }
                'cleanup strategy': !tagged_iterator { tag: 'pimcore.datahub.data_importer.cleanup', index_by: 'type' }
                'data target': !tagged_iterator { tag: 'pimcore.datahub.data_importer.data_target', index_by: 'type' }
                'transformation': !tagged_iterator { tag: 'pimcore.datahub.data_importer.operator', index_by: 'type' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ProposeImportConfigTool:
        tags:
            - {
                name: 'pimcore.mcp_tool',
                group: 'pimcore-data-importer-propose',
                description: 'Propose changes to an import configuration for review'
              }
