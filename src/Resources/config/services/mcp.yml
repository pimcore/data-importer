# loaded only when mcp server is active

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Authentication is handled by the pimcore_mcp firewall (studio-backend-bundle)

    # PSR-16 Simple Cache for MCP sessions
    pimcore.datahub.data-importer.mcp.cache.simple:
        class: Symfony\Component\Cache\Psr16Cache
        arguments:
            - '@cache.app'

    # Service locator for MCP tool/resource classes (enables PSR-11 container access)
    pimcore.datahub.data-importer.mcp.service_locator:
        class: Symfony\Component\DependencyInjection\ServiceLocator
        arguments:
            - Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ValidateConfigurationTool: '@Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ValidateConfigurationTool'
              Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ListAvailableClassesTool: '@Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ListAvailableClassesTool'
              Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetConfigurationContextTool: '@Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetConfigurationContextTool'
              Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetConfigurationExamplesTool: '@Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetConfigurationExamplesTool'
              Pimcore\Bundle\DataImporterBundle\Mcp\Tool\EnrichConfigurationTool: '@Pimcore\Bundle\DataImporterBundle\Mcp\Tool\EnrichConfigurationTool'
              Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetClassFieldsForLoadingTool: '@Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetClassFieldsForLoadingTool'
              Pimcore\Bundle\DataImporterBundle\Mcp\Tool\CreateDataImporterConfigTool: '@Pimcore\Bundle\DataImporterBundle\Mcp\Tool\CreateDataImporterConfigTool'
              Pimcore\Bundle\DataImporterBundle\Mcp\Tool\SaveDataImporterConfigTool: '@Pimcore\Bundle\DataImporterBundle\Mcp\Tool\SaveDataImporterConfigTool'
        tags: ['container.service_locator']


    # MCP Server
    Pimcore\Bundle\DataImporterBundle\Mcp\Service\McpServerBuilder:
        arguments:
            $container: '@pimcore.datahub.data-importer.mcp.service_locator'
            $logger: '@logger'
            $cache: '@pimcore.datahub.data-importer.mcp.cache.simple'

    pimcore.datahub.data-importer.mcp.server:
        class: Mcp\Server
        factory: ['@Pimcore\Bundle\DataImporterBundle\Mcp\Service\McpServerBuilder', 'buildServer']

    # MCP Controller
    Pimcore\Bundle\DataImporterBundle\Mcp\Controller\McpController:
        public: true
        arguments:
            $server: '@pimcore.datahub.data-importer.mcp.server'
        tags: ['controller.service_arguments']

    # MCP Tools - Auto-discovered via attributes, but registered for DI.
    # Tagged with pimcore.mcp_tool so the Agent bundle's McpToolRegistryPass
    # can collect them into its registry (cross-bundle integration).
    # If PimcoreAgentBundle is not installed, the tags are simply unused.
    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ValidateConfigurationTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer',
                description: 'Data Importer configuration and validation tools' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ListAvailableClassesTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetConfigurationContextTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetConfigurationExamplesTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\EnrichConfigurationTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetClassFieldsForLoadingTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\CreateDataImporterConfigTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\SaveDataImporterConfigTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer' }