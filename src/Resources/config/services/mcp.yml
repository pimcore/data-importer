# Loaded only when mcp/sdk is installed, see PimcoreDataImporterExtension::load().
#
# This bundle ships MCP tools, not an MCP server. The tools are registered with the Pimcore
# Agent Bundle through its documented `pimcore.mcp_tool` tag; without that bundle the tags are
# simply unused, and a third party can register the same handlers in its own Mcp\Server.

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Split the way the Pimcore Agent Bundle splits its own domains, so an agent can be granted
    # inspection of the import schema without also being granted the ability to write configurations.

    # --- Read (discovery, schema, validation, enrichment) ---
    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetConfigurationExamplesTool:
        tags:
            - name: 'pimcore.mcp_tool'
              group: 'pimcore-data-importer-read'
              description: 'Read-only access to Data Importer configurations, schema and examples'

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetConfigurationContextTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ListImportConfigsTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetImportConfigTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetClassFieldsForLoadingTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ValidateConfigurationTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\EnrichConfigurationTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read' }

    # --- Direct write (create / replace a configuration, no approval step) ---
    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\CreateDataImporterConfigTool:
        tags:
            - name: 'pimcore.mcp_tool'
              group: 'pimcore-data-importer-direct-write'
              description: 'Create and replace Data Importer configurations (no approval required)'

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\SaveDataImporterConfigTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-direct-write' }
