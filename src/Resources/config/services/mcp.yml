# Loaded only when an MCP host is installed AND Change Control is - see
# PimcoreDataImporterExtension. Without the review lane there is nothing to propose onto.
services:
    _defaults:
        autowire: true
        autoconfigure: false
        public: false

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ListImportConfigsTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read', description: 'List the import configurations' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\GetImportConfigTool:
        tags:
            - { name: 'pimcore.mcp_tool', group: 'pimcore-data-importer-read' }

    Pimcore\Bundle\DataImporterBundle\Mcp\Tool\ProposeImportConfigTool:
        tags:
            - {
                name: 'pimcore.mcp_tool',
                group: 'pimcore-data-importer-propose',
                description: 'Propose changes to an import configuration for review'
              }
